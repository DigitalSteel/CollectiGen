name: Contributor checks

on:
  push:
    branches: [codex/public-contributor-baseline]
  pull_request:
    branches: [codex/public-contributor-baseline]

permissions:
  contents: read

concurrency:
  group: contributor-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contributor-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify the published export
        if: github.event_name == 'push'
        run: python -B tools/Test-PublicSource.py . --allow-git-metadata
      - name: Install pytest
        run: python -m pip install "pytest>=8,<9"
      - name: Run focused source checks
        run: python -B -m pytest -q -p no:cacheprovider tests/test_public_component_source.py
